version: 2

models:
  - name: dim_teams
    description: "Clubs participating in the Premier League competition"
    columns:
      - name: team_id
        description: "Unique team identifier"
        tests:
          - unique
          - not_null
      - name: team_name
        description: "Official team name"
        tests:
          - not_null

  - name: fact_matches
    description: "Premier League fixtures and match results"
    columns:
      - name: match_id
        description: "Unique match identifier"
        tests:
          - unique
          - not_null
      - name: match_date
        description: "Match kickoff timestamp in UTC"
        tests:
          - not_null
      - name: home_team_id
        description: "Foreign key reference to dim_teams"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_teams')
                field: team_id
      - name: away_team_id
        description: "Foreign key reference to dim_teams"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_teams')
                field: team_id
      - name: status
        description: "Current fixture status"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - SCHEDULED
                  - TIMED
                  - IN_PLAY
                  - PAUSED
                  - FINISHED
                  - POSTPONED
                  - SUSPENDED
                  - CANCELLED
      - name: home_score
        description: "Home score (NULL if match unplayed, never 0 for unplayed)"
      - name: away_score
        description: "Away score (NULL if match unplayed, never 0 for unplayed)"
